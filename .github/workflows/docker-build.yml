name: Verify Dockerfile Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Docker (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install docker
          brew install colima

      - name: Start Colima (macOS only)
        if: runner.os == 'macOS'
        run: colima start

      - name: Set Docker context to Colima (macOS only)
        if: runner.os == 'macOS'
        run: docker context use colima

      - name: Install Docker Buildx (macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/.docker/cli-plugins
          brew install docker-buildx
          ln -sf /opt/homebrew/opt/docker-buildx/bin/docker-buildx ~/.docker/cli-plugins/docker-buildx

      - name: Enable BuildKit and build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            docker buildx create --use || true
            docker buildx build --load -t packing-task-stub .
          else
            docker build -t packing-task-stub .
          fi

