name: Verify Dockerfile Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker on macOS
        if: runner.os == 'macOS'
        uses: docker-practice/actions-setup-docker@v1

      - name: Enable BuildKit and build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: docker build -t packing-task-stub .
